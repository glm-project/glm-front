<header data-selector="app-bar" class="bg-primary text-primary-foreground flex h-16 items-center gap-4 px-4">
  <button hlmBtn variant="ghost" size="icon" aria-label="Menu" data-selector="app-bar-menu-trigger" [hlmDropdownMenuTrigger]="menu">
    <ng-icon name="lucideMenu" />
  </button>
  <ng-template #menu>
    <hlm-dropdown-menu data-selector="app-bar-menu">
      <!-- seed4j-needle-angular-menu -->
    </hlm-dropdown-menu>
  </ng-template>
  <span>{{ appName() }}</span>
  <img alt="Angular logo" class="angular-logo" ngSrc="content/images/AngularLogo.svg" width="50" height="50" priority />
  <span class="space-separator" id="menu-space-separator"></span>
  <seed-login />
</header>

<img alt="Seed4J logo" class="seed4j-logo" ngSrc="../../../../content/images/seed4j_logo-name.png" width="100" height="100" priority />

<router-outlet />

<div id="footer">
  <h1>{{ appName() }}: Angular + TypeScript</h1>
  <h2 class="text-2xl font-bold text-blue-600">Tailwind CSS Enabled</h2>
  <p>
    <a href="https://angular.dev" target="_blank" rel="noopener">Angular Documentation</a>
    |
    <a href="https://angular.dev/tools/cli" target="_blank" rel="noopener">Angular CLI Documentation</a>
  </p>
  <p>
    Edit
    <code>app.ts</code> to test hot module replacement.
  </p>
</div>
