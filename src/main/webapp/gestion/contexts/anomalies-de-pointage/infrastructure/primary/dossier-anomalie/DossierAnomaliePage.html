<main class="mx-auto max-w-7xl px-4 py-6 text-ink md:px-8 md:py-8" aria-labelledby="dossier-heading">
  <a class="gestion-retour" routerLink="/anomalies" [queryParams]="retour()" data-selector="anomalie-retour">{{ libelles.retour }}</a>
  <h1 id="dossier-heading" class="mt-2 text-title">{{ libelles.dossier }}</h1>
  @if (lecture.isLoading()) {
  <p role="status" data-selector="anomalie-chargement">{{ libelles.chargementDossier }}</p>
  } @if (resolution(); as resolution) { @if (dossierRelu()) {
  <p role="status" class="mt-4 text-body-sm" data-selector="anomalie-dossier-relu">{{ libelles.regularisation.dossierRelu }}</p>
  }
  <glm-resolution-de-fin
    [dossier]="resolution.dossier"
    [adresse]="resolution.adresse"
    [retour]="retour()"
    [now]="now"
    [operateurs]="operateursConnus()"
    (relectureDemandee)="relire()"
  />
  } @if (lecture.error()) {
  <div role="alert" class="py-8">
    <p>{{ libelles.erreurLecture }}</p>
    <button type="button" class="bouton mt-3" data-selector="anomalie-retry" (click)="reload()">{{ libelles.reessayer }}</button>
  </div>
  }
</main>
