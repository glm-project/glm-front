<div data-selector="anomalie-resolution">
  <glm-en-tete-du-dossier [dossier]="dossier()" [now]="now()" />
  <glm-section-de-frise
    [dossier]="dossier()"
    [now]="now()"
    [operateur]="operateur()"
    [poignee]="poignee()"
    [placement]="placement()"
    (deplacementDemande)="deplacer($event)"
    (placementDemande)="placer($event)"
  />
  @if (regularisee(); as heure) {
  <p class="mt-4 text-body font-semibold" role="status" data-selector="anomalie-resolution-regularisee">
    {{ libelles.regularisee(heure) }}
  </p>
  <button
    type="button"
    class="bouton bouton-principal mt-4"
    data-selector="anomalie-resolution-suivante"
    [attr.aria-busy]="rechercheEnCours()"
    [disabled]="rechercheEnCours()"
    (click)="passerALaSuivante()"
  >
    {{ libelles.anomalieSuivante }}
  </button>
  } @else { @if (message(); as message) {
  <p class="mt-4 text-body-sm text-danger" role="alert" data-selector="anomalie-resolution-refus">{{ message }}</p>
  }
  <button
    type="button"
    class="bouton bouton-principal mt-4"
    data-selector="anomalie-resolution-valider"
    [disabled]="!validable()"
    [attr.aria-busy]="etat().kind === 'EN_COURS'"
    (click)="valider()"
  >
    {{ libelleDeValider() }}
  </button>
  }
</div>
