<glm-search-picker
  #picker
  [triggerId]="triggerId()"
  [triggerSelector]="selector()"
  [labelledBy]="labelId() + ' ' + triggerId() + '-identite'"
  [describedBy]="describedBy()"
  [panelId]="selector() + '-panneau'"
  panelWidth="360px"
  panelMaxHeight="calc(100dvh - 32px)"
  [panelLabel]="libelles.choisirOperateur"
  [searchLabel]="libelles.rechercherOperateur"
  [searchSelector]="selector() + '-recherche'"
  [disabled]="disabled()"
  [focusAfterRender]="true"
  [(search)]="saisie"
  (detached)="picker.opened.set(false)"
>
  <span pickerIdentity class="identite" [id]="triggerId() + '-identite'">{{ identite() }}</span>
  @if (propositions().length === 0) {
  <p role="status" class="py-3 text-body-sm text-ink-muted" [attr.data-selector]="selector() + '-sans-resultat'">
    {{ libelles.aucunResultatOperateur }}
  </p>
  }
  <ul>
    @if (avecTous() && saisie() === '') {
    <li>
      <button
        type="button"
        class="min-h-touch text-body text-ink"
        [attr.aria-current]="tousEstCourant() ? 'true' : null"
        [attr.data-selector]="selector() + '-proposition'"
        (click)="chooseAll(picker)"
      >
        <span class="nom">{{ libelles.tousLesOperateurs }}</span>
      </button>
    </li>
    } @if (nonResolu() && saisie() === '') {
    <li>
      <button
        type="button"
        class="min-h-touch text-body text-ink"
        aria-current="true"
        [attr.data-selector]="selector() + '-proposition'"
        (click)="picker.close()"
      >
        <span class="nom">{{ libelles.operateurNonResoluActuel }}</span>
      </button>
    </li>
    } @for (operateur of propositions(); track operateur.id.operateur) {
    <li>
      <button
        type="button"
        class="min-h-touch text-body text-ink"
        [attr.aria-current]="operateur.id.operateur === courant() ? 'true' : null"
        [attr.data-selector]="selector() + '-proposition'"
        (click)="choose(operateur.id, picker)"
      >
        <span class="nom">{{ nomme(operateur) }}</span>
      </button>
    </li>
    }
  </ul>
</glm-search-picker>
