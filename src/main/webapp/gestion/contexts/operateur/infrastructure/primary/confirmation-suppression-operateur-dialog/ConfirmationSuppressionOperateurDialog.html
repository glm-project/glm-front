<glm-confirmation-content
  title="Supprimer l’opérateur ?"
  cancelLabel="Annuler"
  confirmLabel="Supprimer"
  pendingLabel="Suppression…"
  [pending]="suppression()"
  [destructive]="true"
  [technicalErrorMessage]="erreurTechnique() ? 'La suppression a échoué. Vérifiez la connexion puis réessayez.' : undefined"
  [refusalMessage]="refus()?.message"
  selectorPrefix="operateur-delete"
  (cancelRequested)="dialog.close(false)"
  (confirmRequested)="confirm()"
>
  <p class="text-body" data-selector="operateur-delete-description">
    L’opérateur <strong>{{ operateur.prenom.value }} {{ operateur.nom.value }}</strong> sera retiré du référentiel. Cette action est
    définitive.
  </p>
</glm-confirmation-content>
