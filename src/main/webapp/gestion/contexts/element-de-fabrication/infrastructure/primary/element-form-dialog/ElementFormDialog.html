<h2 mat-dialog-title class="text-section" data-selector="element-form-title">{{ titre }}</h2>
<form novalidate (submit)="save($event)" data-selector="element-form">
  <mat-dialog-content>
    <p class="mb-6 text-body-sm text-ink-muted">{{ libelles.introduction }}</p>
    <fieldset [disabled]="enregistrement()" class="fields">
      <glm-text-field
        fieldId="element-reference"
        name="reference"
        [label]="libelles.reference"
        [labelComplement]="libelles.referenceComplement"
        [help]="libelles.referenceAide"
        [value]="formulaire().saisie.reference"
        [error]="soumis() ? formulaire().erreurReference() : undefined"
        (valueChanged)="changeReference($event)"
      />
      <glm-text-field
        fieldId="element-libelle"
        name="libelle"
        [label]="libelles.libelle"
        [labelComplement]="libelles.libelleComplement"
        [help]="libelles.libelleAide"
        [value]="formulaire().saisie.libelle"
        [error]="soumis() ? formulaire().erreurLibelle() : undefined"
        (valueChanged)="changeLibelle($event)"
      />
    </fieldset>
    @if (formulaire().erreurEnregistrement(); as erreur) {
    <p role="alert" class="mt-4 text-body-sm text-danger" data-selector="element-enregistrement-error">{{ erreur }}</p>
    } @if (erreurTechnique()) {
    <p role="alert" class="mt-4 text-body-sm text-danger" data-selector="element-technical-error">{{ libelles.erreurTechnique }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false" [disabled]="enregistrement()" data-selector="element-cancel">
      {{ libelles.annuler }}
    </button>
    <button mat-flat-button type="submit" [disabled]="enregistrement()" data-selector="element-save">
      {{ enregistrement() ? libelles.enregistrement : libelles.enregistrer }}
    </button>
  </mat-dialog-actions>
</form>
