<glm-confirmation-content
  [title]="libelles.titre"
  [cancelLabel]="libelles.annuler"
  [confirmLabel]="libelles.confirmer"
  [pendingLabel]="libelles.encours"
  [pending]="cloture()"
  [technicalErrorMessage]="erreurTechnique() ? libelles.erreurTechnique : undefined"
  [refusalMessage]="refus()?.message"
  selectorPrefix="element-cloture"
  (cancelRequested)="dialog.close(false)"
  (confirmRequested)="confirm()"
>
  <p class="text-body" data-selector="element-cloture-description">{{ libelles.description(numero) }}</p>
</glm-confirmation-content>
