<section class="gestion-carte journal" aria-labelledby="synthese-journal-titre">
  <h2 id="synthese-journal-titre" class="text-section" data-selector="synthese-journal-titre">{{ journal().titre }}</h2>
  @if (journal().entrees.length > 0) {
  <ol class="entrees">
    @for (entree of journal().entrees; track entree.rang) {
    <li>
      <button
        type="button"
        [attr.aria-pressed]="entree.selectionne"
        (click)="choisi.emit(entree.rang)"
        data-selector="synthese-journal-entree"
      >
        <span class="heure" data-selector="synthese-journal-heure">{{ entree.heure }}</span>
        <span class="pointage" data-selector="synthese-journal-pointage"
          ><i [class]="'glyphe ' + entree.glyphe" aria-hidden="true"></i>{{ entree.libelle }}</span
        >
        <span class="objet" data-selector="synthese-journal-objet">{{ entree.objet }}</span>
        <span class="poste" data-selector="synthese-journal-poste">{{ entree.poste }}</span>
      </button>
    </li>
    }
  </ol>
  } @else {
  <p class="vide" data-selector="synthese-journal-vide">{{ libelles.sansPointageCeJour }}</p>
  }
</section>
