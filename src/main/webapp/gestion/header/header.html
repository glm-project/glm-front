<header class="barre">
  <div class="mx-auto flex h-full max-w-7xl items-center gap-8 px-4 md:px-8">
    <a routerLink="/" class="marque" [attr.aria-label]="libelles.accueil(heading())">
      <svg class="marque-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect class="marque-logo-fond" width="32" height="32" rx="8" />
        <path class="marque-logo-moule" d="M6 7h9v4a5 5 0 0 0 0 10v4H6z" />
        <path class="marque-logo-moule" d="M17 7h9v18h-9v-4a5 5 0 0 0 0-10z" />
      </svg>
      <span class="marque-texte">
        <span class="marque-nom" data-selector="header-heading">{{ heading() }}</span>
        <span class="marque-produit">{{ libelles.produit }}</span>
      </span>
    </a>

    <nav
      id="gestion-navigation"
      class="navigation"
      [class.navigation-ouverte]="menuOuvert()"
      [attr.aria-label]="libelles.navigation"
      data-selector="gestion-navigation"
    >
      <ul class="navigation-liste">
        @for (destination of destinations; track destination.route) {
        <li>
          <a
            class="lien"
            [routerLink]="destination.route"
            routerLinkActive="lien-actif"
            [routerLinkActiveOptions]="{ exact: destination.exacte }"
            ariaCurrentWhenActive="page"
            [attr.data-selector]="destination.selecteur"
            (click)="fermerMenu()"
            >{{ destination.libelle }}</a
          >
        </li>
        }
      </ul>
    </nav>

    <div class="ml-auto flex items-center gap-1">
      <button type="button" class="action" [attr.aria-label]="libelles.deconnexion" data-selector="gestion-logout" (click)="logout()">
        <glm-icon name="logOut" />
        <span class="action-libelle" aria-hidden="true">{{ libelles.deconnexion }}</span>
      </button>
      <button
        type="button"
        class="action bascule-menu"
        [attr.aria-label]="libelles.menu"
        [attr.aria-expanded]="menuOuvert()"
        aria-controls="gestion-navigation"
        data-selector="gestion-menu"
        (click)="basculerMenu()"
      >
        <glm-icon [name]="menuOuvert() ? 'x' : 'menu'" />
      </button>
    </div>
  </div>
</header>
