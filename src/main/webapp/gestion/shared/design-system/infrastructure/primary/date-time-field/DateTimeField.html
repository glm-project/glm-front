<fieldset>
  <legend class="field-label">{{ labels().legend }}</legend>
  <div class="parts">
    <div class="part">
      <label class="field-label" [for]="fieldId() + '-date'">{{ labels().date }}</label>
      <div class="control">
        <input
          #day="matDatepickerInput"
          [id]="fieldId() + '-date'"
          class="field-input"
          autocomplete="off"
          [placeholder]="labels().datePlaceholder"
          [matDatepicker]="calendar"
          [value]="entry().shown"
          [disabled]="disabled()"
          [attr.aria-describedby]="fieldId() + '-error'"
          [attr.data-selector]="selector() + '-date'"
          (dateInput)="compose(day.value, time.value())"
        />
        <mat-datepicker-toggle [for]="calendar" [disabled]="disabled()" [attr.data-selector]="selector() + '-calendrier'" />
        <mat-datepicker #calendar />
      </div>
    </div>
    <div class="part">
      <label class="field-label" [for]="fieldId() + '-time'">{{ labels().time }}</label>
      <div class="control">
        <input
          #time="matTimepickerInput"
          [id]="fieldId() + '-time'"
          class="field-input"
          autocomplete="off"
          [placeholder]="labels().timePlaceholder"
          [matTimepicker]="clock"
          [value]="entry().shown"
          [disabled]="disabled()"
          [attr.aria-describedby]="fieldId() + '-error'"
          [attr.data-selector]="selector() + '-heure'"
          (valueChange)="compose(day.value, $event)"
        />
        <mat-timepicker-toggle
          [for]="clock"
          [aria-label]="labels().openTimeList"
          [disabled]="disabled()"
          [attr.data-selector]="selector() + '-horloge'"
        />
        <mat-timepicker #clock [aria-label]="labels().timeList" />
      </div>
    </div>
  </div>
  <p
    [id]="fieldId() + '-error'"
    class="field-error"
    aria-live="polite"
    [attr.data-selector]="selector() + '-erreur'"
    [textContent]="entry().skippedHour ? labels().skippedHour : ''"
  ></p>
</fieldset>
