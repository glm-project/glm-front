<glm-pupitre-header
  heading="glmfront"
  [connected]="pupitre.connected()"
  [operateur]="pupitre.operateur()"
  [message]="messageAtelier()"
  (finRequested)="finish()"
  (reinitialisationRequested)="askReset()"
/>

@if (enrolement.vue().kind === 'ENROLE_ET_PRET') { @if (pupitre.operateur()) { @if (pupitre.pointage(); as vue) {
<glm-pointage
  [vue]="vue"
  [commander]="pupitre"
  [gestesDisponibles]="pupitre.gestesDisponibles()"
  (pauseRequested)="executeGlobale('PAUSE')"
  (repriseRequested)="executeGlobale('REPRENDRE')"
  (arretTotalRequested)="executeGlobale('TOUT_ARRETER')"
/>
} } @else {
<glm-designation />
} } @else {
<glm-enrolement />
} @if (resetRequested()) {
<glm-reinitialisation (annule)="cancelReset()" (confirme)="confirmReset()" />
}
