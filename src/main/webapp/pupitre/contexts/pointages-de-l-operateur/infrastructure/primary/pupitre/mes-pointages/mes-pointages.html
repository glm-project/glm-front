<main class="min-h-0 flex-1 overflow-y-auto bg-canvas px-6 py-4">
  <h1 class="text-title text-ink">{{ labels.titre }}</h1>
</main>

<nav class="flex shrink-0 gap-3 border-t border-border bg-surface px-6 py-3" [attr.aria-label]="labels.actions">
  <button
    type="button"
    (click)="retourRequested.emit()"
    class="min-h-touch-lg rounded border-2 border-border-strong bg-surface px-6 text-section text-ink"
    data-selector="retour-au-pointage"
  >
    {{ labels.retour }}
  </button>
</nav>
