<div class="dialog-backdrop">
  <div
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    class="dialog-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reinitialisation-titre"
  >
    <h2 id="reinitialisation-titre" class="text-title text-ink" data-selector="reset-title">{{ labels.titre }}</h2>
    <p class="text-body text-ink-muted" data-selector="reset-message">{{ labels.message }}</p>
    @if (avertissement(); as texte) {
    <p class="text-body text-danger" data-selector="reset-pending-warning"><strong>{{ texte }}</strong></p>
    }
    <div class="dialog-actions">
      <button
        #annuler
        type="button"
        class="min-h-touch-lg rounded border-2 border-border-strong bg-surface px-6 text-body text-ink"
        data-selector="reset-cancel"
        (click)="annule.emit()"
      >
        {{ labels.annuler }}
      </button>
      <button
        type="button"
        [disabled]="confirmationAvailable() === false"
        class="min-h-touch-lg rounded bg-danger px-6 text-body text-on-accent"
        data-selector="reset-confirm"
        (click)="confirme.emit()"
      >
        {{ confirmationLibelle() }}
      </button>
    </div>
  </div>
</div>
