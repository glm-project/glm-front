<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Prototype jetable — pupitre, écran de pointage (#11)</title>
<style>
  /* Tokens repris de glm-pointage/src/styles.css, décision #7.
     Prototype à jeter : rien ici n'est du code de production. */
  :root {
    --canvas: #F4F6F8;
    --surface: #FFFFFF;
    --sunken: #E9EDF2;
    --border: #D3DBE3;
    --border-strong: #A9B6C4;
    --ink: #0F1824;
    --ink-muted: #4A5A6B;
    --accent: #0B63CE;
    --on-accent: #FFFFFF;
    --ok: #166534;
    --nc: #B91C1C;
    --glm: #6D28D9;
    --warn: #854D0E;
    --touch: 44px;
    --touch-lg: 52px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    /* Le bouton d'échelle unique du pupitre, décision #7 : un seul font-size. */
    font-size: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1b2027; color: var(--ink); display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }

  .mur {
    width: 1920px; height: 1080px; transform-origin: top left;
    background: var(--canvas); display: flex; flex-direction: column;
    border-radius: 8px; overflow: hidden; flex: none;
  }

  /* ─── En-tête : identité désignée, ligne de refus, « J'ai fini », signe passif ─── */
  header {
    height: 120px; flex: none; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 2fr auto; align-items: center;
    gap: 1.5rem; padding: 0 1.5rem;
  }
  .identite { display: flex; flex-direction: column; }
  .identite .nom { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
  .identite .code { font-size: 1rem; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  /* Q9 — un seul message à la fois, nommant le numéro, dans le chrome. */
  .refus {
    min-height: 3rem; display: flex; align-items: center; gap: 0.75rem;
    padding: 0 1rem; border-radius: 8px; font-size: 1.15rem; font-weight: 600;
    color: var(--nc); background: color-mix(in srgb, var(--nc) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--nc) 35%, transparent);
    opacity: 0; transition: opacity .12s;
  }
  .refus[data-visible="oui"] { opacity: 1; }
  .refus .cible { font-variant-numeric: tabular-nums; padding: 0 .5rem; border-radius: 4px;
                  background: var(--nc); color: var(--on-accent); }

  .coin { display: flex; align-items: center; gap: 1.25rem; }
  /* #9 — signe passif, un seul état, non interactif, muet pour qui pointe. */
  .synchro { display: flex; align-items: center; gap: .5rem; font-size: .8rem;
             color: var(--ink-muted); letter-spacing: .08em; font-weight: 600; }
  .synchro .pastille { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .synchro[data-en-ligne="non"] .pastille { background: var(--border-strong); }

  .fini {
    min-height: var(--touch-lg); padding: 0 1.5rem; border-radius: 8px;
    border: 2px solid var(--border-strong); background: var(--surface);
    font-size: 1.1rem; font-weight: 600; color: var(--ink); cursor: pointer;
  }

  /* ─── La grille ─── */
  main { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
  .zone + .zone { margin-top: 1.25rem; }
  .zone h2 {
    font-size: .8rem; letter-spacing: .08em; font-weight: 600; text-transform: uppercase;
    color: var(--ink-muted); margin-bottom: .5rem;
  }
  /* Q8 — grille fluide : autant de colonnes qu'il en tient au plancher de tuile. */
  .tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }

  .tuile {
    min-height: 100px; background: var(--surface); border: 2px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  /* Q1 — la couleur porte MON activité, et rien d'autre. Une tuile où je ne suis pas
     est neutre : l'écran au repos doit être gris, sans quoi le vert ne veut plus rien dire. */
  .tuile[data-mien="oui"] {
    border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface));
    box-shadow: inset 6px 0 0 var(--ok);
  }
  /* #8 — la non conformité est un TROISIÈME canal, jamais une troisième couleur. */
  .tuile[data-nc="oui"] {
    border-color: var(--nc); box-shadow: inset 6px 0 0 var(--nc);
    background:
      repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--nc) 13%, transparent) 9px 18px),
      color-mix(in srgb, var(--nc) 7%, var(--surface));
  }

  .tuile .tete { flex: 1; padding: .45rem .6rem 0 .8rem; display: flex;
                 flex-direction: column; gap: .1rem; }
  .ligne1 { display: flex; align-items: center; justify-content: space-between; gap: .3rem; }
  .tuile .numero { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums;
                   letter-spacing: -0.01em; line-height: 1.05; white-space: nowrap; }
  /* Repli sur le `nom` généré : plus long, plus petit, et il a le droit de passer à la ligne. */
  .tuile[data-repli="oui"] .numero { font-size: .85rem; color: var(--ink-muted);
                                     white-space: normal; line-height: 1.2; word-break: break-word; }
  /* Q6 — durée figée à l'ouverture de la fenêtre, sur mes seules tuiles actives. */
  .tuile .duree { font-size: .8rem; font-weight: 600; color: var(--ink-muted);
                  font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tuile .marque-nc { font-size: .68rem; font-weight: 700; letter-spacing: .08em;
                      color: var(--on-accent); background: var(--nc); flex: none;
                      padding: .1rem .35rem; border-radius: 4px; }

  /* Q7 — deux cibles tactiles permanentes, jamais d'appui long.
     La cible principale n'est saturée QUE quand elle arrête : au repos, rien ne crie. */
  .actions { display: flex; gap: 3px; padding: .4rem .4rem .4rem .7rem; }
  .actions button {
    min-height: var(--touch); border-radius: 6px; cursor: pointer;
    font-size: .82rem; font-weight: 700; letter-spacing: .04em;
  }
  .principal { flex: 1; background: var(--surface); color: var(--ink-muted);
               border: 1px solid var(--border-strong); }
  .tuile[data-mien="oui"] .principal { background: var(--ok); color: var(--on-accent); border-color: var(--ok); }
  .tuile[data-nc="oui"] .principal { background: var(--nc); color: var(--on-accent); border-color: var(--nc); }
  .secondaire { width: 56px; flex: none; background: var(--surface); color: var(--nc);
                border: 1px solid color-mix(in srgb, var(--nc) 45%, transparent); }
  .tuile[data-nc="oui"] .secondaire { color: var(--ok); border-color: var(--ok); width: 64px;
                                      background: var(--surface); }

  /* ─── Q5 — bandeau GLM : inerte, sans chiffre, allumé quand aucun élément actif ─── */
  .glm {
    height: 72px; flex: none; display: flex; align-items: center; gap: 1rem;
    padding: 0 1.5rem; border-top: 1px solid var(--border); background: var(--sunken);
    color: var(--ink-muted); font-size: 1rem;
  }
  .glm[data-allume="oui"] { background: color-mix(in srgb, var(--glm) 12%, var(--surface));
                            color: var(--glm); border-top-color: var(--glm); }
  .glm .etiquette { font-size: 1.3rem; font-weight: 700; letter-spacing: .04em; }

  /* ─── Q4 — trois boutons globaux permanents ─── */
  nav {
    height: 100px; flex: none; display: flex; gap: .75rem; align-items: center;
    padding: 0 1.5rem; background: var(--surface); border-top: 1px solid var(--border);
  }
  nav button {
    min-height: var(--touch-lg); height: 64px; flex: 1; border-radius: 8px; cursor: pointer;
    font-size: 1.2rem; font-weight: 700; letter-spacing: .04em; border: 2px solid transparent;
  }
  .b-pause { background: var(--warn); color: var(--on-accent); }
  .b-reprendre { background: var(--surface); color: var(--warn); border-color: var(--warn); }
  .b-tout { background: var(--surface); color: var(--nc); border-color: var(--nc); flex: 0 0 380px; }

  /* ─── Q2 — pop-up de poste, seulement si plusieurs habilitations ─── */
  .modale[hidden] { display: none; }
  .modale { position: fixed; inset: 0; background: rgba(15,24,36,.55);
            display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modale .boite { background: var(--surface); border-radius: 12px; padding: 1.5rem;
                   min-width: 520px; }
  .modale h3 { font-size: 1.4rem; margin-bottom: .25rem; }
  .modale p { color: var(--ink-muted); margin-bottom: 1rem; }
  .modale .choix { display: grid; gap: .5rem; }
  .modale .choix button { min-height: var(--touch-lg); border-radius: 8px; cursor: pointer;
    border: 2px solid var(--border-strong); background: var(--surface);
    font-size: 1.1rem; font-weight: 600; text-align: left; padding: 0 1rem; }
  .modale .annuler { margin-top: 1rem; width: 100%; min-height: var(--touch);
    border: none; background: var(--sunken); border-radius: 8px; cursor: pointer; font-size: 1rem; }

  /* ─── Échafaudage de démo : ne fait pas partie de l'écran ─── */
  .bricolage { background: #262d36; color: #cfd8e3; border-radius: 8px; padding: 1rem;
               font-size: .8rem; width: 240px; flex: none; position: sticky; top: 1rem; }
  .bricolage h4 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
                  color: #8fa0b4; margin-bottom: .6rem; }
  .bricolage label { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; cursor: pointer; }
  .bricolage button { width: 100%; margin-top: .5rem; padding: .5rem; border-radius: 6px;
                      border: 1px solid #3c4654; background: #313a46; color: #cfd8e3; cursor: pointer; }
  .bricolage hr { border: none; border-top: 1px solid #3c4654; margin: .8rem 0; }
</style>
</head>
<body>

<div class="mur" id="mur">
  <header>
    <div class="identite">
      <span class="nom">MARTIN Luc</span>
      <span class="code">Code 049 · fenêtre 30 s</span>
    </div>
    <div class="refus" id="refus" data-visible="non">
      <span class="cible" id="refus-cible">1015</span>
      <span id="refus-texte">L'élément a été clôturé.</span>
    </div>
    <div class="coin">
      <div class="synchro" id="synchro" data-en-ligne="oui"><span class="pastille"></span><span id="synchro-mot">CONNECTÉ</span></div>
      <button class="fini">J'ai fini</button>
    </div>
  </header>

  <main>
    <section class="zone" id="zone-produit"><h2>Moules</h2><div class="tuiles"></div></section>
    <section class="zone" id="zone-of"><h2>OF</h2><div class="tuiles"></div></section>
  </main>

  <div class="glm" id="glm" data-allume="oui">
    <span class="etiquette">GLM</span>
    <span id="glm-mot">Aucun élément en cours — ton temps de présence est compté ici.</span>
  </div>

  <nav>
    <button class="b-pause">PAUSE</button>
    <button class="b-reprendre">REPRENDRE</button>
    <button class="b-tout" id="b-tout">TOUT ARRÊTER</button>
  </nav>
</div>

<div class="modale" id="modale" hidden>
  <div class="boite">
    <h3>Sur quelle machine ?</h3>
    <p id="modale-element">Élément 1015</p>
    <div class="choix" id="modale-choix"></div>
    <button class="annuler" id="modale-annuler">Annuler</button>
  </div>
</div>

<aside class="bricolage">
  <h4>Échafaudage</h4>
  <label><input type="checkbox" id="opt-multiposte"> Opérateur multi-postes</label>
  <label><input type="checkbox" id="opt-hors-ligne"> Hors ligne</label>
  <label><input type="checkbox" id="opt-beaucoup"> 80 éléments engagés</label>
  <button id="opt-refus">Simuler un refus métier</button>
  <hr>
  <p style="line-height:1.5">Prototype jetable du ticket
  <strong>#11</strong>. Ce panneau ne fait pas partie de l'écran.</p>
</aside>

<script>
// ─────────── Données bidon ───────────
const POSTES = [
  { id: 'p1', libelle: 'Érosion 1', nature: 'érosion' },
  { id: 'p2', libelle: 'Érosion 2', nature: 'érosion' },
  { id: 'p3', libelle: 'Fraiseuse 3', nature: 'fraisage' },
];

const base = [];
[1015, 1016, 1017, 1018, 1020, 1021, 1023, 1024, 1025, 1030, 1031, 1032]
  .forEach(r => base.push({ id: 'm' + r, type: 'PRODUIT', reference: String(r) }));
[2201, 2204, 2205, 2208, 2210, 2212, 2214, 2215, 2219, 2220, 2222, 2225,
 2226, 2230, 2231, 2233, 2234, 2238, 2240, 2241, 2245]
  .forEach(r => base.push({ id: 'o' + r, type: 'ORDRE_DE_FABRICATION', reference: String(r) }));
// Deux éléments sans `reference` : la tuile retombe sur le `nom` généré.
base.push({ id: 'o9001', type: 'ORDRE_DE_FABRICATION', reference: null, nom: 'OF-2026-000091' });
base.push({ id: 'm9002', type: 'PRODUIT', reference: null, nom: 'PR-2026-000007' });

const gonfle = [];
for (let i = 0; i < 45; i++) gonfle.push({ id: 'x' + i, type: 'ORDRE_DE_FABRICATION', reference: String(3100 + i) });

// Mon état sur chaque élément : 'absente' | 'travail' | 'nc'
const mien = { m1015: 'travail', o2214: 'nc', o2205: 'travail' };
const duree = { m1015: '2 h 14', o2214: '0 h 22', o2205: '19 h 03' };

const $ = s => document.querySelector(s);
const opt = { multiposte: false, horsLigne: false, beaucoup: false };
let enAttenteDePoste = null;

// Tri naturel : « 204 » avant « 1015 », jamais lexicographique. Q8.
const naturel = (a, b) => (a.reference ?? a.nom).localeCompare(
  b.reference ?? b.nom, 'fr', { numeric: true });

function elements() {
  return opt.beaucoup ? base.concat(gonfle) : base;
}

function rendu() {
  for (const [type, sel] of [['PRODUIT', '#zone-produit'], ['ORDRE_DE_FABRICATION', '#zone-of']]) {
    const zone = $(sel);
    const lot = elements().filter(e => e.type === type).sort(naturel);
    // #8 — une zone vide disparaît, en-tête compris.
    zone.hidden = lot.length === 0;
    zone.querySelector('.tuiles').innerHTML = lot.map(tuile).join('');
  }
  const actifs = Object.values(mien).filter(e => e !== 'absente').length;
  $('#glm').dataset.allume = actifs === 0 ? 'oui' : 'non';
  $('#glm-mot').textContent = actifs === 0
    ? 'Aucun élément en cours — ton temps de présence est compté ici.'
    : 'Ton temps est affecté.';
  $('#synchro').dataset.enLigne = opt.horsLigne ? 'non' : 'oui';
  $('#synchro-mot').textContent = opt.horsLigne ? 'PAS CONNECTÉ' : 'CONNECTÉ';
  câble();
}

function tuile(e) {
  const etat = mien[e.id] ?? 'absente';
  const numero = e.reference ?? e.nom;
  const principal = etat === 'absente' ? 'DÉMARRER' : 'ARRÊTER';
  const secondaire = etat === 'nc' ? 'BON' : 'NC';
  return `
    <div class="tuile" data-id="${e.id}"
         data-mien="${etat === 'travail' ? 'oui' : 'non'}"
         data-nc="${etat === 'nc' ? 'oui' : 'non'}"
         data-repli="${e.reference ? 'non' : 'oui'}">
      <div class="tete">
        <div class="ligne1">
          <span class="numero">${numero}</span>
          ${etat === 'nc' ? '<span class="marque-nc">NC</span>' : ''}
        </div>
        ${etat !== 'absente' ? `<span class="duree">depuis ${duree[e.id] ?? '0 h 04'}</span>` : ''}
      </div>
      <div class="actions">
        <button class="principal" data-geste="principal">${principal}</button>
        <button class="secondaire" data-geste="secondaire">${secondaire}</button>
      </div>
    </div>`;
}

function câble() {
  document.querySelectorAll('.tuile button').forEach(b => {
    b.onclick = () => geste(b.closest('.tuile').dataset.id, b.dataset.geste);
  });
}

function geste(id, quel) {
  const etat = mien[id] ?? 'absente';
  // Q2 — la pop-up n'apparaît QUE si l'opérateur est habilité sur plusieurs postes,
  // et seulement à l'ouverture d'une activité. Sinon : un seul clic.
  if (etat === 'absente' && opt.multiposte) {
    enAttenteDePoste = { id, quel };
    $('#modale-element').textContent = 'Élément ' + numeroDe(id);
    $('#modale-choix').innerHTML = POSTES.map(p =>
      `<button data-poste="${p.id}">${p.libelle} <span style="color:var(--ink-muted);font-weight:400">· ${p.nature}</span></button>`).join('');
    $('#modale-choix').querySelectorAll('button').forEach(b => {
      b.onclick = () => { $('#modale').hidden = true; applique(id, quel); enAttenteDePoste = null; };
    });
    $('#modale').hidden = false;
    return;
  }
  applique(id, quel);
}

// L'automate EtatDActivite du back : depuis chaque état, exactement deux transitions.
function applique(id, quel) {
  const etat = mien[id] ?? 'absente';
  if (etat === 'absente') mien[id] = quel === 'principal' ? 'travail' : 'nc';
  else if (etat === 'travail') mien[id] = quel === 'principal' ? 'absente' : 'nc';
  else mien[id] = quel === 'principal' ? 'absente' : 'travail';
  if (mien[id] !== 'absente' && !duree[id]) duree[id] = '0 h 00';
  if (mien[id] === 'absente') delete duree[id];
  rendu();
}

function numeroDe(id) {
  const e = elements().find(x => x.id === id);
  return e.reference ?? e.nom;
}

// Q9 — la tuile revient, et une ligne unique du chrome nomme le numéro et la cause.
$('#opt-refus').onclick = () => {
  const cible = Object.keys(mien).find(k => mien[k] !== 'absente') ?? 'm1015';
  mien[cible] = 'absente'; delete duree[cible];
  $('#refus-cible').textContent = numeroDe(cible);
  $('#refus-texte').textContent = "L'élément a été clôturé.";
  $('#refus').dataset.visible = 'oui';
  rendu();
};

$('#b-tout').onclick = () => { // FIN × N, puis DEPART. Q4.
  Object.keys(mien).forEach(k => delete mien[k]);
  Object.keys(duree).forEach(k => delete duree[k]);
  rendu();
};
$('#modale-annuler').onclick = () => { $('#modale').hidden = true; enAttenteDePoste = null; };
$('#opt-multiposte').onchange = e => { opt.multiposte = e.target.checked; };
$('#opt-hors-ligne').onchange = e => { opt.horsLigne = e.target.checked; rendu(); };
$('#opt-beaucoup').onchange = e => { opt.beaucoup = e.target.checked; rendu(); };

// Le mur fait 1920×1080 ; on le rétrécit pour tenir dans la fenêtre.
function échelle() {
  const k = Math.min((window.innerWidth - 300) / 1920, (window.innerHeight - 32) / 1080, 1);
  const m = $('#mur');
  m.style.transform = `scale(${k})`;
  m.style.marginRight = `${-1920 * (1 - k)}px`;
  m.style.marginBottom = `${-1080 * (1 - k)}px`;
}
// Les variantes sont adressables : ?beaucoup&multiposte&horsLigne
const q = new URLSearchParams(location.search);
[['multiposte', '#opt-multiposte'], ['horsLigne', '#opt-hors-ligne'], ['beaucoup', '#opt-beaucoup']]
  .forEach(([clé, sel]) => { if (q.has(clé)) { opt[clé] = true; $(sel).checked = true; } });

window.onresize = échelle;
échelle();
rendu();
</script>
</body>
</html>
